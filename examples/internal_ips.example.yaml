# ============================================================================
# Internal IP map — COMPLETE worked example
# ============================================================================
# Organizations keep this knowledge in IPAM pages and spreadsheets: which
# network is which department, hostel, building, floor, room. Written here as
# YAML, the engine turns it into per-event enrichment (GeoIP for your OWN
# address space). All names/ranges below are fictional — replace them with
# your real allocation table.
#
# To use it:  cp examples/internal_ips.example.yaml database/internal_ips.yaml
# (or build it in the Web UI's "IP Map" tab — visual editor with per-field
# ECS checking). The engine hot-reloads edits within ~10 s. The file is
# .gitignore'd: your real network plan never goes to git.
#
# ---------------------------------------------------------------------------
# KEYWORDS (the complete list)
#   defaults:   optional. fields added to EVERY entry of this file
#               (an entry's own fields win on conflict)
#   networks:   the list of entries. Each entry may have:
#     range:    one range (or several, comma-separated)  } use one of the
#     ranges:   a YAML list of ranges                    } two, not both
#     name:     plain-text label -> stored as geo.name (real ECS field,
#               shows up right next to GeoIP city/country in Kibana)
#     fields:   any extra dotted-name fields added to matching events,
#               nested under source. / destination.
#
# RANGE SYNTAX (mix freely; write networks the way YOUR tables print them)
#   10.50.0.0/16                CIDR network            <- IPAM "Network" column
#   10.70.32.0/255.255.224.0    IP + subnet mask        <- "Subnet Mask" column
#   10.10.1.1-10.10.1.10        full range              <- DHCP pool style
#   10.10.1.1-10                short range (last octet varies)
#   10.10.0.53                  single host
#   [10.10.2.11-15, 10.10.9.1-5]  several ranges = one entry
#
# RECOMMENDED FIELDS (custom site.* namespace — allowed by the validator;
# use what you have, skip what you don't):
#   site.zone         the ONE generic dimension every org can fill:
#                     department | hostel | residential | server-room |
#                     guest-wifi | infrastructure | vpn ...
#                     -> a Kibana pie of source.site.zone instantly shows
#                        WHERE traffic comes from, even with a coarse map
#   site.department   AERO / CSE / Physics ...
#   site.building     Hostel 01 / Engineering Building ...
#   site.wing         Wing 1 / A ...
#   site.floor        "0,1" / basement / 3 ...
#   site.room         "101" / B03 / A-108 ...
#   site.type         finer detail: teaching-lab / faculty-office /
#                     dhcp-pool / meeting-room ...
#   site.owner        team or person responsible
#   site.contact      how to reach them
#   site.organization usually set once in defaults:
#
# LAYERING (the killer feature): declare broad networks AND narrower ranges
# inside them. A matching IP gets ALL the layers merged, most specific wins
# a conflict. Example below: 10.50.1.7 gets the department /16 fields + the
# floor /24 fields + the room fields.
# ============================================================================

defaults:
  site.organization: "Example University"

networks:
  # ------------------------------------------------------------------
  # DEPARTMENTS — broad /16s straight from the IPAM "Network" column.
  # Even a map with ONLY entries like these gives instant, useful
  # dashboards (zone + department per event).
  # ------------------------------------------------------------------
  - range: 10.50.0.0/16
    name: "Engineering department network"
    fields:
      site.zone: "department"
      site.department: "Engineering"

  - range: 10.60.0.0/16
    name: "Physics department network"
    fields:
      site.zone: "department"
      site.department: "Physics"

  # ------------------------------------------------------------------
  # HOSTELS — hostel number, wing, floor. The range is written in
  # IP/netmask form, exactly as the allocation page prints it
  # (DHCP pool 10.70.32.0 - 10.70.63.255, mask 255.255.224.0).
  # ------------------------------------------------------------------
  - range: 10.70.32.0/255.255.224.0
    name: "Hostel 01 / Wing 1 / Floor 0-1"
    fields:
      site.zone: "hostel"
      site.building: "Hostel 01"
      site.wing: "1"
      site.floor: "0,1"
      site.type: "dhcp-pool"

  - range: 10.70.64.0-10.70.95.255          # same pool as a full range
    name: "Hostel 01 / Wing 2 / Floor 2-3"
    fields:
      site.zone: "hostel"
      site.building: "Hostel 01"
      site.wing: "2"
      site.floor: "2,3"
      site.type: "dhcp-pool"

  # ------------------------------------------------------------------
  # RESIDENTIAL / STAFF QUARTERS
  # ------------------------------------------------------------------
  - range: 10.80.0.0/16
    name: "Staff residential network"
    fields:
      site.zone: "residential"

  # ------------------------------------------------------------------
  # LAYERING inside a department: floor subnet + rooms inside it.
  # 10.50.1.7 -> Engineering dept (above) + this floor + room 101.
  # ------------------------------------------------------------------
  - range: 10.50.1.0/24
    name: "Engineering 1st floor"
    fields:
      site.building: "Engineering Building"
      site.floor: "1"

  - range: 10.50.1.1-10                     # short range: last octet only
    name: "Class room 1 (101)"
    fields:
      site.room: "101"
      site.type: "classroom"

  - range: 10.50.1.11-20
    name: "Class room 2 (102)"
    fields:
      site.room: "102"
      site.type: "classroom"

  # One room served by several disjoint ranges -> one entry
  - ranges: [10.50.2.11-15, 10.50.9.1-5]
    name: "Faculty office 108"
    fields:
      site.building: "Engineering Building"
      site.floor: "1"
      site.room: "108"
      site.type: "faculty-office"

  # ------------------------------------------------------------------
  # SERVER ROOM / DATACENTER — a zone worth its own alerting rules
  # ------------------------------------------------------------------
  - ranges: [10.50.100.0/24, 10.50.101.0/24]
    name: "Engineering server room (113)"
    fields:
      site.zone: "server-room"
      site.building: "Engineering Building"
      site.room: "113"
      site.owner: "sysadmin team"
      site.contact: "sysadmin@example.edu"

  # ------------------------------------------------------------------
  # SINGLE IMPORTANT HOSTS
  # ------------------------------------------------------------------
  - range: 10.10.0.53
    name: "Campus DNS resolver"
    fields:
      site.zone: "infrastructure"
      site.type: "dns-server"
