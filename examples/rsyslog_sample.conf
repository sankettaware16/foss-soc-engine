# ---------------------------------------------------------------------------
# SAMPLE rsyslog -> Kafka config (for testing replicate.py)
#
# This mirrors a real /etc/rsyslog.d/*.conf that forwards logs to Kafka.
# replicate.py reads THIS file to learn:
#   - which log file becomes which source_program (the Tag)
#   - which tags rsyslog actually forwards (the 'if $programname' filter)
#   - which Kafka topic + broker it sends to
#
# Test it with the bundled sample logs:
#   python3 replicate.py --rsyslog examples/rsyslog_sample.conf --logs-dir examples/samples
#
# To use your OWN logs, either edit the File= paths below to real paths, or
# keep them and pass --logs-dir pointing at a folder that contains files with
# the same basenames (postfix.log, access.log, auth.log, fim.json).
# ---------------------------------------------------------------------------

module(load="imfile")
module(load="omkafka")

# The envelope every log is wrapped in before going to Kafka.
template(name="KafkaMailEnvelope" type="list") {
  constant(value="{\"meta\":{")
    constant(value="\"org\":\"iitb\",")
    constant(value="\"dept\":\"trustlab\",")
    constant(value="\"env\":\"production\",")
    constant(value="\"server\":\"mailserver\",")
    constant(value="\"source_host\":\"") property(name="hostname") constant(value="\",")
    constant(value="\"source_program\":\"") property(name="programname") constant(value="\"")
  constant(value="},\"raw\":\"")
    property(name="msg" format="json")
  constant(value="\"}\n")
}

# -------- inputs: each File becomes one source_program (Tag) --------
input(type="imfile" File="/var/log/postfix.log"       Tag="postfix"      Severity="info" Facility="local2")
input(type="imfile" File="/var/log/nginx/access.log"  Tag="nginx_access" Severity="info" Facility="local2")
input(type="imfile" File="/var/log/auth.log"          Tag="linux_auth"   Severity="info" Facility="local2")
input(type="imfile" File="/var/log/tripwire/fim.json" Tag="fim"          Severity="info" Facility="local2")

# -------- forward to Kafka (only the tags listed here are sent) --------
if (
  $programname == 'postfix' or
  $programname == 'nginx_access' or
  $programname == 'linux_auth' or
  $programname == 'fim'
) then {
  action(
    type="omkafka"
    topic="mailserver"
    broker=["localhost:9092"]
    key="%programname%"
    template="KafkaMailEnvelope"
    action.resumeRetryCount="-1"
  )
  stop
}
