<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOSS SOC Engine - Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="bg">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>
  </div>

  <div class="login-wrap">
    <form class="glass login-card" id="login-form" autocomplete="on">
      <div class="login-brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="shieldg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"></stop>
                <stop offset="1" stop-color="#eaf0ff" stop-opacity="0.9"></stop>
              </linearGradient>
            </defs>
            <path d="M12 2.5l7.5 3.2v5c0 4.7-3.2 8-7.5 9.6-4.3-1.6-7.5-4.9-7.5-9.6v-5z"
                  fill="url(#shieldg)" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.6"></path>
            <path d="M8.6 12.2l2.4 2.4 4.6-5" fill="none" stroke="#5b6fd8"
                  stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <div>
          <h1>FOSS SOC Engine</h1>
          <span>console sign in</span>
        </div>
      </div>

      <label class="field">
        <span>Username</span>
        <input id="username" name="username" autocomplete="username" autofocus required />
      </label>
      <label class="field">
        <span>Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>

      <button class="btn primary login-btn" type="submit">Sign in</button>
      <div class="login-msg" id="login-msg"></div>
      <p class="login-hint muted small">{{ hint | safe }}</p>
    </form>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const msg = document.getElementById("login-msg");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      const btn = form.querySelector("button");
      btn.disabled = true; btn.textContent = "Signing in…";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = "/";
        } else {
          msg.textContent = data.error || "Sign in failed";
          msg.className = "login-msg bad";
          btn.disabled = false; btn.textContent = "Sign in";
        }
      } catch (err) {
        msg.textContent = "Network error — is the server running?";
        msg.className = "login-msg bad";
        btn.disabled = false; btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
