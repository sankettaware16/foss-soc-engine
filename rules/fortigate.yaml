# TLSOC rule: Fortinet FortiGate syslog (key=value format).
# Source name "fortigate" -> topic tlsoc.logs.fortigate -> index fosstlsoc-logs-fortigate-*
#
# Pattern 1 (traffic logs, the bulk) reads fields in FortiGate's fixed order: fast.
# Pattern 2 (everything else: utm, event, vpn, ...) finds each field by name in any
# order: slower, but tolerant of the different layout of each log type.
# A field that is missing from a line is simply left out of the event.
pattern_name: "fortigate"
source: "fortigate"
aliases: ["fortinet", "fgt"]
strategy: "multi_match"

timestamp:
  group: ts
  format: epoch

patterns:
  - name: "traffic"
    prematch: 'type="traffic"'
    regex: '^(?:(?=.*?\bdevname="(?P<devname>[^"]*)"))?(?:(?=.*?\bdevid="(?P<devid>[^"]*)"))?.*?\btimestamp=(?P<ts>[^\s"]+)(?:.*?\blogid="(?P<logid>[^"]*)")?(?:.*?\bsubtype="(?P<fsubtype>[^"]*)")?(?:.*?\blevel="(?P<level>[^"]*)")?(?:.*?\bsrcip=(?P<srcip>[^\s"]+))?(?:.*?\bsrcport=(?P<srcport>[^\s"]+))?(?:.*?\bsrcintf="(?P<srcintf>[^"]*)")?(?:.*?\bdstip=(?P<dstip>[^\s"]+))?(?:.*?\bdstport=(?P<dstport>[^\s"]+))?(?:.*?\bdstintf="(?P<dstintf>[^"]*)")?(?:.*?\bsrccountry="(?P<srccountry>[^"]*)")?(?:.*?\bdstcountry="(?P<dstcountry>[^"]*)")?(?:.*?\bsessionid=(?P<sessionid>[^\s"]+))?(?:.*?\bproto=(?P<proto>[^\s"]+))?(?:.*?\baction="(?P<action>[^"]*)")?(?:.*?\bpolicyid=(?P<policyid>[^\s"]+))?(?:.*?\bpolicyname="(?P<policyname>[^"]*)")?(?:.*?\buser="(?P<user>[^"]*)")?(?:.*?\bgroup="(?P<ugroup>[^"]*)")?(?:.*?\bservice="(?P<service>[^"]*)")?(?:.*?\btrandisp="(?P<trandisp>[^"]*)")?(?:.*?\btransip=(?P<transip>[^\s"]+))?(?:.*?\btransport=(?P<transport>[^\s"]+))?(?:.*?\bapp="(?P<app>[^"]*)")?(?:.*?\bappcat="(?P<appcat>[^"]*)")?(?:.*?\bduration=(?P<duration>[^\s"]+))?(?:.*?\bsentbyte=(?P<sentbyte>[^\s"]+))?(?:.*?\brcvdbyte=(?P<rcvdbyte>[^\s"]+))?'
    mapping:
      ts: "event.original_time"
      devname: "observer.name"
      devid: "observer.serial_number"
      logid: "event.code"
      fsubtype: "fortigate.subtype"
      level: "log.level"
      srcip: "source.ip"
      srcport: "source.port|int"
      srcintf: "observer.ingress.interface.name"
      dstip: "destination.ip"
      dstport: "destination.port|int"
      dstintf: "observer.egress.interface.name"
      srccountry: "fortigate.src_country"
      dstcountry: "fortigate.dst_country"
      sessionid: "fortigate.session_id"
      proto: "network.iana_number"
      action: "event.action"
      policyid: "rule.id"
      policyname: "rule.name"
      user: "user.name"
      ugroup: "user.group.name"
      service: "fortigate.service"
      trandisp: "fortigate.nat_type"
      transip: "source.nat.ip"
      transport: "source.nat.port|int"
      app: "network.application"
      appcat: "fortigate.app_category"
      duration: "fortigate.duration_sec|int"
      sentbyte: "source.bytes|int"
      rcvdbyte: "destination.bytes|int"
    static:
      event.kind: "event"
      event.category: "network"
      observer.vendor: "Fortinet"
      observer.product: "FortiGate"
      observer.type: "firewall"

  - name: "utm_app_control"
    prematch: 'subtype="app-ctrl"'
    regex: '^(?:(?=.*?\bdevname="(?P<devname>[^"]*)"))?(?:(?=.*?\bdevid="(?P<devid>[^"]*)"))?.*?\btimestamp=(?P<ts>[^\s"]+)(?:.*?\blogid="(?P<logid>[^"]*)")?(?:.*?\bsubtype="(?P<fsubtype>[^"]*)")?(?:.*?\blevel="(?P<level>[^"]*)")?(?:.*?\buser="(?P<user>[^"]*)")?(?:.*?\bgroup="(?P<ugroup>[^"]*)")?(?:.*?\bsrcip=(?P<srcip>[^\s"]+))?(?:.*?\bsrccountry="(?P<srccountry>[^"]*)")?(?:.*?\bdstip=(?P<dstip>[^\s"]+))?(?:.*?\bdstcountry="(?P<dstcountry>[^"]*)")?(?:.*?\bsrcport=(?P<srcport>[^\s"]+))?(?:.*?\bdstport=(?P<dstport>[^\s"]+))?(?:.*?\bsrcintf="(?P<srcintf>[^"]*)")?(?:.*?\bdstintf="(?P<dstintf>[^"]*)")?(?:.*?\bproto=(?P<proto>[^\s"]+))?(?:.*?\bservice="(?P<service>[^"]*)")?(?:.*?\bpolicyid=(?P<policyid>[^\s"]+))?(?:.*?\bsessionid=(?P<sessionid>[^\s"]+))?(?:.*?\baction="(?P<action>[^"]*)")?(?:.*?\bappcat="(?P<appcat>[^"]*)")?(?:.*?\bapp="(?P<app>[^"]*)")?(?:.*?\bhostname="(?P<hostname>[^"]*)")?(?:.*?\burl="(?P<url>[^"]*)")?(?:.*?\bmsg="(?P<msg>[^"]*)")?(?:.*?\bapprisk="(?P<apprisk>[^"]*)")?'
    mapping:
      ts: "event.original_time"
      devname: "observer.name"
      devid: "observer.serial_number"
      logid: "event.code"
      fsubtype: "fortigate.subtype"
      level: "log.level"
      user: "user.name"
      ugroup: "user.group.name"
      srcip: "source.ip"
      srccountry: "fortigate.src_country"
      dstip: "destination.ip"
      dstcountry: "fortigate.dst_country"
      srcport: "source.port|int"
      dstport: "destination.port|int"
      srcintf: "observer.ingress.interface.name"
      dstintf: "observer.egress.interface.name"
      proto: "network.iana_number"
      service: "fortigate.service"
      policyid: "rule.id"
      sessionid: "fortigate.session_id"
      action: "event.action"
      appcat: "fortigate.app_category"
      app: "network.application"
      hostname: "url.domain"
      url: "url.original"
      msg: "message"
      apprisk: "fortigate.app_risk"
    static:
      event.kind: "event"
      event.category: "network"
      observer.vendor: "Fortinet"
      observer.product: "FortiGate"
      observer.type: "firewall"

  - name: "utm_web_filter"
    prematch: 'subtype="webfilter"'
    regex: '^(?:(?=.*?\bdevname="(?P<devname>[^"]*)"))?(?:(?=.*?\bdevid="(?P<devid>[^"]*)"))?.*?\btimestamp=(?P<ts>[^\s"]+)(?:.*?\blogid="(?P<logid>[^"]*)")?(?:.*?\bsubtype="(?P<fsubtype>[^"]*)")?(?:.*?\blevel="(?P<level>[^"]*)")?(?:.*?\bpolicyid=(?P<policyid>[^\s"]+))?(?:.*?\bsessionid=(?P<sessionid>[^\s"]+))?(?:.*?\bsrcip=(?P<srcip>[^\s"]+))?(?:.*?\bsrcport=(?P<srcport>[^\s"]+))?(?:.*?\bsrccountry="(?P<srccountry>[^"]*)")?(?:.*?\bsrcintf="(?P<srcintf>[^"]*)")?(?:.*?\bdstip=(?P<dstip>[^\s"]+))?(?:.*?\bdstport=(?P<dstport>[^\s"]+))?(?:.*?\bdstcountry="(?P<dstcountry>[^"]*)")?(?:.*?\bdstintf="(?P<dstintf>[^"]*)")?(?:.*?\bproto=(?P<proto>[^\s"]+))?(?:.*?\bhttpmethod="(?P<httpmethod>[^"]*)")?(?:.*?\bservice="(?P<service>[^"]*)")?(?:.*?\bhostname="(?P<hostname>[^"]*)")?(?:.*?\bagent="(?P<agent>[^"]*)")?(?:.*?\baction="(?P<action>[^"]*)")?(?:.*?\burl="(?P<url>[^"]*)")?(?:.*?\bsentbyte=(?P<sentbyte>[^\s"]+))?(?:.*?\brcvdbyte=(?P<rcvdbyte>[^\s"]+))?(?:.*?\bmsg="(?P<msg>[^"]*)")?(?:.*?\bcatdesc="(?P<catdesc>[^"]*)")?'
    mapping:
      ts: "event.original_time"
      devname: "observer.name"
      devid: "observer.serial_number"
      logid: "event.code"
      fsubtype: "fortigate.subtype"
      level: "log.level"
      policyid: "rule.id"
      sessionid: "fortigate.session_id"
      srcip: "source.ip"
      srcport: "source.port|int"
      srccountry: "fortigate.src_country"
      srcintf: "observer.ingress.interface.name"
      dstip: "destination.ip"
      dstport: "destination.port|int"
      dstcountry: "fortigate.dst_country"
      dstintf: "observer.egress.interface.name"
      proto: "network.iana_number"
      httpmethod: "http.request.method"
      service: "fortigate.service"
      hostname: "url.domain"
      agent: "user_agent.original"
      action: "event.action"
      url: "url.original"
      sentbyte: "source.bytes|int"
      rcvdbyte: "destination.bytes|int"
      msg: "message"
      catdesc: "fortigate.web_category"
    static:
      event.kind: "event"
      event.category: "network"
      observer.vendor: "Fortinet"
      observer.product: "FortiGate"
      observer.type: "firewall"

  - name: "other"
    prematch: "logid="
    regex: '^(?:(?=.*?\bdevname="(?P<devname>[^"]*)"))?(?:(?=.*?\bdevid="(?P<devid>[^"]*)"))?(?:(?=.*?\blogid="(?P<logid>[^"]*)"))?(?:(?=.*?\btype="(?P<ftype>[^"]*)"))?(?:(?=.*?\bsubtype="(?P<fsubtype>[^"]*)"))?(?:(?=.*?\blevel="(?P<level>[^"]*)"))?(?:(?=.*?\baction="(?P<action>[^"]*)"))?(?:(?=.*?\bsrcip=(?P<srcip>[^\s"]+)))?(?:(?=.*?\bsrcport=(?P<srcport>[^\s"]+)))?(?:(?=.*?\bdstip=(?P<dstip>[^\s"]+)))?(?:(?=.*?\bdstport=(?P<dstport>[^\s"]+)))?(?:(?=.*?\bsrcintf="(?P<srcintf>[^"]*)"))?(?:(?=.*?\bdstintf="(?P<dstintf>[^"]*)"))?(?:(?=.*?\bproto=(?P<proto>[^\s"]+)))?(?:(?=.*?\bpolicyid=(?P<policyid>[^\s"]+)))?(?:(?=.*?\bpolicyname="(?P<policyname>[^"]*)"))?(?:(?=.*?\bservice="(?P<service>[^"]*)"))?(?:(?=.*?\bapp="(?P<app>[^"]*)"))?(?:(?=.*?\bappcat="(?P<appcat>[^"]*)"))?(?:(?=.*?\bapprisk="(?P<apprisk>[^"]*)"))?(?:(?=.*?\bsentbyte=(?P<sentbyte>[^\s"]+)))?(?:(?=.*?\brcvdbyte=(?P<rcvdbyte>[^\s"]+)))?(?:(?=.*?\bduration=(?P<duration>[^\s"]+)))?(?:(?=.*?\bsessionid=(?P<sessionid>[^\s"]+)))?(?:(?=.*?\buser="(?P<user>[^"]*)"))?(?:(?=.*?\bgroup="(?P<ugroup>[^"]*)"))?(?:(?=.*?\bhostname="(?P<hostname>[^"]*)"))?(?:(?=.*?\burl="(?P<url>[^"]*)"))?(?:(?=.*?\bhttpmethod="(?P<httpmethod>[^"]*)"))?(?:(?=.*?\bagent="(?P<agent>[^"]*)"))?(?:(?=.*?\bmsg="(?P<msg>[^"]*)"))?(?:(?=.*?\bsrccountry="(?P<srccountry>[^"]*)"))?(?:(?=.*?\bdstcountry="(?P<dstcountry>[^"]*)"))?(?:(?=.*?\btrandisp="(?P<trandisp>[^"]*)"))?(?:(?=.*?\btransip=(?P<transip>[^\s"]+)))?(?:(?=.*?\btransport=(?P<transport>[^\s"]+)))?(?:(?=.*?\bcatdesc="(?P<catdesc>[^"]*)"))?(?=.*?\btimestamp=(?P<ts>\d+))'
    mapping:
      ts: "event.original_time"
      devname: "observer.name"
      devid: "observer.serial_number"
      logid: "event.code"
      ftype: "fortigate.type"
      fsubtype: "fortigate.subtype"
      level: "log.level"
      action: "event.action"
      srcip: "source.ip"
      srcport: "source.port|int"
      dstip: "destination.ip"
      dstport: "destination.port|int"
      srcintf: "observer.ingress.interface.name"
      dstintf: "observer.egress.interface.name"
      proto: "network.iana_number"
      policyid: "rule.id"
      policyname: "rule.name"
      service: "fortigate.service"
      app: "network.application"
      appcat: "fortigate.app_category"
      apprisk: "fortigate.app_risk"
      sentbyte: "source.bytes|int"
      rcvdbyte: "destination.bytes|int"
      duration: "fortigate.duration_sec|int"
      sessionid: "fortigate.session_id"
      user: "user.name"
      ugroup: "user.group.name"
      hostname: "url.domain"
      url: "url.original"
      httpmethod: "http.request.method"
      agent: "user_agent.original"
      msg: "message"
      srccountry: "fortigate.src_country"
      dstcountry: "fortigate.dst_country"
      trandisp: "fortigate.nat_type"
      transip: "source.nat.ip"
      transport: "source.nat.port|int"
      catdesc: "fortigate.web_category"
    static:
      event.kind: "event"
      event.category: "network"
      observer.vendor: "Fortinet"
      observer.product: "FortiGate"
      observer.type: "firewall"
