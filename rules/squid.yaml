  - name: "none_upstream_fail"
    prematch: "HIER_NONE"
    regex: '^(?P<sys_ts>\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}|\S+)\s+(?P<host>\S+)\s+\((?P<proc_name>[^)]+)\)\[(?P<pid>\d+)\]:\s+(?P<event_created>\d+\.\d+)\s+(?P<duration>\d+)\s+(?P<src_ip>\d+\.\d+\.\d+\.\d+):(?P<src_port>\d+)\s+-:-\s+(?P<action>NONE)/(?P<status>\d+)\s+(?P<bytes>\d+)\s+(?P<method>\S+)\s+(?P<dst>[^:\s]+):(?P<dst_port>\d+)\s+-\s+HIER_NONE/-\s+-$'
    mapping:
      host: ["host.name", "observer.hostname"]   # the proxy NODE (tp1..tpN): host.name + pipeline-proof observer.hostname
      proc_name: "process.name"
      pid: "process.pid|int"
      duration: "event.duration|int"
      src_ip: "source.ip"
      src_port: "source.port|int"
      action: "event.action"
      status: "http.response.status_code|int"
      bytes: "source.bytes|int"
      method: "http.request.method"
      dst: "destination.address"
      dst_port: "destination.port|int"
    static:
      observer.vendor: "Squid"
      observer.product: "Squid Proxy"
      observer.type: "proxy"
      service.type: "proxy"
      network.transport: "tcp"
      event.category: "network"
      event.type: "error"
      event.kind: "event"
      event.outcome: "failure"
