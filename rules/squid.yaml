  - name: "none_http2_preface"
    prematch: "PRI"
    regex: '^(?P<sys_ts>\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}|\S+)\s+(?P<host>\S+)\s+\((?P<proc_name>[^)]+)\)\[(?P<pid>\d+)\]:\s+(?P<event_created>\d+\.\d+)\s+(?P<duration>\d+)\s+(?P<src_ip>\d+\.\d+\.\d+\.\d+):(?P<src_port>\d+)\s+-:-\s+(?P<action>NONE(?:_ABORTED)?)/(?P<status>\d+)\s+(?P<bytes>\d+)\s+(?P<method>PRI)\s+\*\s+-\s+HIER_NONE/-\s+(?P<content_type>\S+)$'
    mapping:
      host: ["host.name", "observer.hostname"]   # the proxy NODE (tp1..tpN): host.name + pipeline-proof observer.hostname
      proc_name: "process.name"
      pid: "process.pid|int"
      duration: "event.duration|int"
      src_ip: "source.ip"
      src_port: "source.port|int"
      action: "event.action"
      status: "http.response.status_code|int"
      bytes: "source.bytes|int"
      method: "http.request.method"
      content_type: "http.response.mime_type"
    static:
      observer.vendor: "Squid"
      observer.product: "Squid Proxy"
