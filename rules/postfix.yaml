pattern_name: "postfix"

strategy: "stateful"
id_regex: '(?P<id>[A-Z0-9]{10,12}):'
end_signal: "removed"

# ---------------------------------------------------------------------------
# EDIT THIS for your site: the mail domain(s) this server considers INTERNAL.
# Senders/recipients at these domains are tagged internal, everyone else
# external. Plain domains only (no regex) - one or more list entries.
# ---------------------------------------------------------------------------
vars:
  internal_domains: ["example.com"]
  # Optional rsyslog prefix "HOST postfix/<daemon>[PID]: " - captures the
  # relay host on one-line (no queue id) events. Not a site setting.
  pfx: '(?:(?P<hostname>[\w.-]+) postfix/[\w/.-]+\[\d+\]: )?'

# rsyslog prefixes each line with an ISO-8601 stamp (with offset). For a
# correlated transaction the event time is its FIRST line (transaction start).
timestamp:
  regex: '^(?P<ts>\d{4}-\d{2}-\d{2}T\S+)'
  format: iso8601

patterns:
  # Rejected before queueing (sender/recipient/RBL/policy checks). FIRST on
  # purpose: lines without a queue id stop at the first matching pattern, and
  # the sender/recipient patterns below would otherwise claim these lines.
  # The reason may itself contain ";" (RBL text); from=<> is a bounce.
  - prematch: "NOQUEUE: reject:"
    regex: '%{pfx}NOQUEUE: reject: (?P<stage>[A-Z-]+) from (?P<client_host>[^\s\[]+)\[(?P<ip>[^\]]+)\](?::\d+)?: (?P<code>\d{3} \d\.\d\.\d+) (?P<reason>.*?);(?: from=<(?P<sender>[^>]+)?>)?(?: to=<(?P<recipient>[^>]+)?>)? proto='
    mapping: { "hostname": "host.name", "stage": "email.smtp_phase", "client_host": "source.domain", "ip": "source.ip", "code": "event.code", "reason": "event.reason", "sender": "email.from.address", "recipient": "email.to.address" }
    static: { "event.action": "smtp_reject", "event.outcome": "failure" }

  - prematch: "sasl_username="
    regex: 'sasl_username=(?P<auth_user>[^, ]+)'
    mapping: { "auth_user": "user.name" }

  # Internal Sender
  - prematch: "from=<"
    regex: 'from=<(?P<sender>[^@]+@(?P<s_domain>%{internal_domains}))>'
    mapping: { "sender": "email.from.address", "s_domain": "email.sender_domain" }
    static: { "email.internal_sender": true, "email.sender_type": "internal" }

  # External Sender
  - prematch: "from=<"
    regex: 'from=<(?P<sender>[^@]+@(?P<s_domain>(?!%{internal_domains})[^>]+))>'
    mapping: { "sender": "email.from.address", "s_domain": "email.sender_domain" }
    static: { "email.internal_sender": false, "email.sender_type": "external" }

  # Internal Recipient
  - prematch: "to=<"
    regex: 'to=<(?P<recipient>[^@]+@(?P<r_domain>%{internal_domains}))>.*status=(?P<status>[a-z]+)'
    mapping: { "recipient": "email.to.address", "r_domain": "email.recipient_domain", "status": "event.outcome" }
    static: { "email.external_recipient": false, "email.recipient_type": "internal" }

  # External Recipient
  - prematch: "to=<"
    regex: 'to=<(?P<recipient>[^@]+@(?P<r_domain>(?!%{internal_domains})[^>]+))>.*status=(?P<status>[a-z]+)'
    mapping: { "recipient": "email.to.address", "r_domain": "email.recipient_domain", "status": "event.outcome" }
    static: { "email.external_recipient": true, "email.recipient_type": "external" }

  - prematch: "relay="
    regex: 'relay=(?P<relay_host>[^\[]+)\[(?P<relay_ip>[\d\.]+)\]'
    mapping: { "relay_host": "email.relay.hostname", "relay_ip": "email.relay.ip" }

  - prematch: "client="
    regex: 'client=(?P<host>.*?)\[(?P<ip>[\d\.]+)\]'
    mapping: { "ip": "source.ip" }

  - prematch: "non-delivery notification"
    regex: 'postfix/bounce.*sender non-delivery notification: (?P<bounce_id>\w+)'
    mapping: { "bounce_id": "event.reason" }
    static: { "event.outcome": "bounced" }


  - prematch: "connect from"
    regex: '%{pfx}(?<!dis)connect from (?P<client_host>[^\[]+)\[(?P<ip>[^\]]+)\]'
    mapping: { "hostname": "host.name", "client_host": "source.domain", "ip": "source.ip" }
    static: { "event.action": "smtp_connect" }

  - prematch: "disconnect from"
    regex: '%{pfx}disconnect from (?P<client_host>[^\[]+)\[(?P<ip>[^\]]+)\].*commands=(?P<commands>\d+)'
    mapping: { "hostname": "host.name", "client_host": "source.domain", "ip": "source.ip", "commands": "event.command_count|int" }
    static: { "event.action": "smtp_disconnect" }

  - prematch: "Anonymous TLS connection"
    regex: '%{pfx}Anonymous TLS connection established from (?P<client_host>[^\[]+)\[(?P<ip>[^\]]+)\]: (?P<tls_version>TLSv[\d\.]+) with cipher (?P<cipher>[A-Z0-9\-]+)'
    mapping: { "hostname": "host.name", "client_host": "source.domain", "ip": "source.ip", "tls_version": "tls.version", "cipher": "tls.cipher" }
    static: { "event.action": "tls_connection", "network.protocol": "smtp" }

  - prematch: "TLS not available"
    regex: '%{pfx}warning: TLS not available with (?P<client_host>[^\[]+)\[(?P<ip>[^\]]+)\]'
    mapping: { "hostname": "host.name", "client_host": "source.domain", "ip": "source.ip" }
    static: { "event.action": "tls_unavailable", "event.outcome": "warning" }

  - prematch: "message-id="
    regex: 'message-id=<(?P<message_id>[^>]+)>'
    mapping: { "message_id": "email.message_id" }

  - prematch: "nrcpt="
    regex: 'from=<(?P<sender>[^>]+)>, size=(?P<size>\d+), nrcpt=(?P<recipient_count>\d+)'
    mapping: { "sender": "email.from.address", "size": "email.size|int", "recipient_count": "email.recipient_count|int" }

  - prematch: "dsn="
    regex: 'dsn=(?P<dsn>[245]\.[\d\.]+)'
    mapping: { "dsn": "email.dsn" }

  - prematch: "status=deferred"
    regex: 'status=deferred'
    static: { "event.outcome": "deferred" }

  - prematch: "status=bounced"
    regex: 'status=bounced'
    static: { "event.outcome": "bounced" }

  - prematch: "status=sent"
    regex: 'status=sent'
    static: { "event.outcome": "success" }

  - prematch: "relay=local"
    regex: 'relay=local'
    static: { "email.delivery.type": "local" }

  - prematch: "greylisting"
    regex: 'greylisting'
    static: { "event.reason": "greylisted" }

  - prematch: "virus detected"
    regex: 'virus detected: (?P<virus_name>.*)'
    mapping: { "virus_name": "threat.name" }
    static: { "event.category": "malware", "event.outcome": "detected" }

  - prematch: "sasl_method="
    regex: 'sasl_method=(?P<method>\w+)'
    mapping: { "method": "authentication.method" }

  # ------------------------------------------------------------------
  # Auth attacks & connection failures (previously dead-lettered!)
  # e.g. "warning: mail.example.com[1.2.3.4]: SASL PLAIN authentication
  # failed: authentication failure"  <- brute-force attempts, SIEM gold
  # ------------------------------------------------------------------
  - prematch: "authentication failed"
    regex: '%{pfx}warning: (?P<client_host>[^\s\[]+)\[(?P<ip>[^\]]+)\]: SASL (?P<method>[A-Za-z0-9-]+) authentication failed'
    mapping: { "hostname": "host.name", "client_host": "source.domain", "ip": "source.ip", "method": "authentication.method" }
    static: { "event.category": "authentication", "event.action": "auth_failure", "event.outcome": "failure" }

  - prematch: "SASL authentication failure"
    regex: '%{pfx}warning: SASL authentication failure: (?P<reason>.+)'
    mapping: { "hostname": "host.name", "reason": "event.reason" }
    static: { "event.category": "authentication", "event.action": "auth_failure", "event.outcome": "failure" }

  # The phase may carry a byte count: "lost connection after DATA (532625
  # bytes) from unknown[1.2.3.4]" — the parenthetical is optional below.
  - prematch: "lost connection after"
    regex: '%{pfx}lost connection after (?P<phase>[A-Z-]+)(?: \((?P<bytes>\d+) bytes\))? from (?P<client_host>[^\s\[]+)\[(?P<ip>[^\]]+)\]'
    mapping: { "hostname": "host.name", "client_host": "source.domain", "ip": "source.ip", "phase": "email.smtp_phase", "bytes": "network.bytes|int" }
    static: { "event.action": "lost_connection", "event.outcome": "failure" }

  - prematch: "timeout after"
    regex: '%{pfx}timeout after (?P<phase>[A-Z-]+)(?: \((?P<bytes>\d+) bytes\))? from (?P<client_host>[^\s\[]+)\[(?P<ip>[^\]]+)\]'
    mapping: { "hostname": "host.name", "client_host": "source.domain", "ip": "source.ip", "phase": "email.smtp_phase", "bytes": "network.bytes|int" }
    static: { "event.action": "connection_timeout", "event.outcome": "failure" }

  # TLS handshake failures: "SSL_accept error from unknown[1.2.3.4]: -1"
  - prematch: "SSL_accept error"
    regex: '%{pfx}SSL_accept error from (?P<client_host>[^\s\[]+)\[(?P<ip>[^\]]+)\]: (?P<reason>.+)'
    mapping: { "hostname": "host.name", "client_host": "source.domain", "ip": "source.ip", "reason": "event.reason" }
    static: { "event.action": "tls_error", "event.outcome": "failure" }

  # anvil limits hit by one client - brute force / bulk sending:
  # "warning: AUTH command rate limit exceeded: 11 from h[1.2.3.4] for service submission"
  - prematch: "rate limit exceeded"
    regex: '%{pfx}warning: (?P<limit>[A-Za-z ]+?) rate limit exceeded: (?P<count>\d+) from (?P<client_host>[^\s\[]+)\[(?P<ip>[^\]]+)\](?::\d+)? for service (?P<service>\S+)'
    mapping: { "hostname": "host.name", "limit": "event.reason", "count": "email.rate_count|int", "client_host": "source.domain", "ip": "source.ip", "service": "service.name" }
    static: { "event.action": "rate_limit_exceeded", "event.outcome": "failure", "log.level": "warning" }

  # Catch-all for any other postfix warning (config notes, rate limits,
  # unresolvable client hostnames...). After every specific warning pattern,
  # but BEFORE the generic host extractor, which matches every prefixed line.
  - prematch: "warning:"
    regex: '%{pfx}warning: (?P<reason>.+)'
    mapping: { "hostname": "host.name", "reason": "event.reason" }
    static: { "event.action": "warning", "log.level": "warning" }

  # Generic host.name extractor. KEEP LAST: for lines without a queue id the
  # FIRST matching pattern wins, and this one matches every rsyslog-prefixed
  # postfix line - anywhere earlier it would swallow the specific events
  # above (which capture the host themselves via %{pfx}). ID'd transaction
  # lines are unaffected (all patterns apply cumulatively).
  - prematch: "postfix/"
    regex: '\s(?P<hostname>[a-zA-Z0-9-]+)\spostfix\/'
    mapping: { "hostname": "host.name" }
