pattern_name: "suricata"
strategy: "stateless"

# Cheap gate: every fast.log alert line contains "[**]"
prematch: "[**]"

# fast.log stamps sensor-local time with NO timezone. Declare the sensor's
# zone here (e.g. tz: "+05:30"); without it UTC is assumed and the event is
# tagged event.timestamp_source: log_assumed_utc.
timestamp:
  group: timestamp
  format: suricata


regex: '(?P<timestamp>\d{2}/\d{2}/\d{4}-\d{2}:\d{2}:\d{2}\.\d+)\s+\[\*\*\]\s+\[(?P<gid>\d+):(?P<sid>\d+):(?P<rev>\d+)\]\s+(?P<signature>[^\[]+)\s+\[\*\*\]\s+\[Classification:\s+(?P<class>[^\]]+)\]\s+\[Priority:\s+(?P<priority>\d+)\]\s+\{(?P<proto>\w+)\}\s+(?P<src_ip>[\d\.]+):(?P<src_port>\d+)\s+->\s+(?P<dst_ip>[\d\.]+):(?P<dst_port>\d+)'

mapping:

  sid: "event.code"
  signature: "event.reason"
  class: "event.category"
  priority: "event.severity|int"
  proto: "network.transport"
  src_ip: "source.ip"
  src_port: "source.port|int"
  dst_ip: "destination.ip"
  dst_port: "destination.port|int"

static:
  event.type: "ids_alert"
  #event.module: "suricata"
  #observer.type: "ids"
