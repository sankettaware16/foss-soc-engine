pattern_name: "apache_access"

strategy: "stateless"

# Cheap gate: every access-log request line contains "HTTP/"
prematch: "HTTP/"

# Event time = the CLF timestamp in the request line (carries its own offset)
timestamp:
  group: timestamp
  format: clf

# Anchored: a CLF request line always STARTS with the client IP. The ^ also
# kills the O(n^2) scan a leading unanchored quantifier costs on garbage lines.
regex: '^(?P<ip>[\d\.]+) - - \[(?P<timestamp>[^\]]+)\] "(?P<method>\w+) (?P<path>[^\?\s]+)(?:\?(?P<query>[^\s]+))? HTTP/(?P<http_version>[\d\.]+)" (?P<status>\d+) (?P<body_bytes>\d+) "(?P<referrer>[^"]*)" "(?P<user_agent>[^"]*)"'

mapping:

  # Source
  ip: "source.ip"

  # HTTP
  method: "http.request.method"
  status: "http.response.status_code|int"
  body_bytes: "http.response.body.bytes|int"
  user_agent: "user_agent.original"
  referrer: "http.request.referrer"

  # URL (New Structured Fields)
  path: "url.path"
  query: "url.query"
