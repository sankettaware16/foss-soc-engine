pattern_name: "apache_access"

strategy: "stateless"

# Cheap gate: every access-log request line contains "HTTP/"
prematch: "HTTP/"

# Event time = the CLF timestamp in the request line (carries its own offset)
timestamp:
  group: timestamp
  format: clf

# Anchored (kills the O(n^2) scan on garbage lines), with an OPTIONAL leading
# "vhost:port " prefix so BOTH standard Apache formats parse:
#   combined:        203.0.113.7 - - [...] "GET / HTTP/1.1" ...
#   vhost_combined:  www.example.com:443 203.0.113.7 - - [...] "GET / HTTP/2.0" ...
regex: '^(?:(?P<vhost>[^\s:]+):(?P<vport>\d+) )?(?P<ip>[\d\.]+) - - \[(?P<timestamp>[^\]]+)\] "(?P<method>\w+) (?P<path>[^\?\s]+)(?:\?(?P<query>[^\s]+))? HTTP/(?P<http_version>[\d\.]+)" (?P<status>\d+) (?P<body_bytes>\d+) "(?P<referrer>[^"]*)" "(?P<user_agent>[^"]*)"'

mapping:

  # Source
  ip: "source.ip"

  # Virtual host (only present in the vhost_combined format)
  vhost: "url.domain"
  vport: "url.port|int"

  # HTTP
  method: "http.request.method"
  status: "http.response.status_code|int"
  body_bytes: "http.response.body.bytes|int"
  user_agent: "user_agent.original"
  referrer: "http.request.referrer"

  # URL (New Structured Fields)
  path: "url.path"
  query: "url.query"
