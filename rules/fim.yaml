pattern_name: "fim"

strategy: "json_map"

# The FIM JSON currently carries NO time field, so events keep ingest time
# (tagged event.timestamp_source: ingest_fallback). If the agent adds one,
# declare it like:
# timestamp:
#   field: "@timestamp"      # dot-path into the raw JSON
#   format: iso8601

mapping:

#  raw.@timestamp: "event.created"
#  raw.host: "host.name"

  action: "event.action"
#  raw.rule: "rule.name"

  file_path: "file.path"
  owner: "file.owner"
  owner_uid: "file.uid"
  mode: "file.mode"

static:
  event.kind: "alert"
  event.category: "file"
  event.type: "change"
  service.type: "fim"
