pattern_name: "modsec"

strategy: "json_map"

mapping:
  # Basic Info
  transaction.client_ip: "source.ip"
  transaction.host_ip: "destination.ip"
  transaction.unique_id: "event.id"
  
  # Request
  transaction.request.uri: "url.path"
  transaction.request.method: "http.request.method"
  transaction.request.headers.Host: "url.domain"
  transaction.request.headers.User-Agent: "user_agent.original"
  
  # Response
  transaction.response.http_code: "http.response.status_code"
  
  # --- ADVANCED WAF EXTRACTION ---
  # Use '*' to iterate over all messages
  messages.*.message: "event.reason"      # Captures: ["XSS Filter...", "HTML Injection..."]
  messages.*.details.ruleId: "rule.id"    # Captures: ["941160", "941390"]
  messages.*.details.data: "event.payload" # Captures the malicious string
  messages.*.details.severity: "event.severity"
  
  # Extract Tags for better categorization
  messages.*.details.tags: "rule.tags"

static:
  event.kind: "alert"
  event.category: "web"
  event.type: "waf"
  service.type: "modsecurity"
